plugins { id 'com.android.application' }
android {
    ndkVersion "25.2.9519653"
    namespace 'com.nandomx.v5'
    compileSdk 34
    packagingOptions { exclude 'META-INF/DEPENDENCIES'; jniLibs { useLegacyPackaging = true } }
    defaultConfig {
        applicationId "com.nandomx.v5"
        minSdk 26; targetSdk 34; versionCode 5; versionName "5.0 NANDOMX"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation (name:'tun2socks', ext:'aar')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'commons-net:commons-net:3.9.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'org.connectbot:sshlib:2.2.21'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
