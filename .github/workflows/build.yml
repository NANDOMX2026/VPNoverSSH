name: Build APK NANDOMX
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant permission
        run: chmod +x gradlew
      - name: Build Debug and convert to Release
        run: |
         ./gradlew assembleDebug
          mkdir -p app/build/outputs/apk/release/
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-signed.apk
      - name: Upload APK Fixed
        uses: actions/upload-artifact@v4
        with:
          name: NANDOMX-VPN-APK-FIXED
          path: app/build/outputs/apk/release/*.apk

